
server.port=8181

spring.datasource.url=jdbc:postgresql://${AULM_DB_HOST:localhost}:${AULM_DB_PORT:5432}/${AULM_DB_NAME:aulm_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${AULM_DB_USER:postgres}
spring.datasource.password=${AULM_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

aulm.jwt.secret=${AULM_JWT_SECRET:change-this-secret-in-production-please}
aulm.jwt.expiration-minutes=480

spring.mail.host=${AULM_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${AULM_SMTP_PORT:587}
spring.mail.username=${AULM_SMTP_USERNAME}
spring.mail.password=${AULM_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

aulm.mail.from=${AULM_MAIL_FROM:${AULM_SMTP_USERNAME}}
aulm.app-base-url=http://localhost:8181


logging.level.com.vassarlabs.aulm=INFO
